<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0f14">
<title>ARF</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="orb" aria-hidden="true"></span>
      <div>
        <h1>ARF</h1>
        <p class="tagline">Adaptive Responsive Framework</p>
      </div>
    </div>
    <div class="topbar-actions">
      <label class="field">
        <span class="field-label">Language</span>
        <select id="lang-select" aria-label="Assistant language"></select>
      </label>
      <button id="settings-btn" class="icon-btn" type="button" aria-label="Open settings">&#9881;</button>
    </div>
  </header>

  <main class="stage">
    <section class="transcript" id="transcript" aria-live="polite" aria-label="Conversation"></section>

    <div class="status" id="status" role="status">Tap the microphone and speak, or type below.</div>

    <div class="confirm-banner" id="confirm-banner" hidden>
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button id="confirm-yes" class="btn primary" type="button">Confirm</button>
        <button id="confirm-no" class="btn" type="button">Cancel</button>
      </div>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <button id="mic-btn" class="mic" type="button" aria-label="Start listening" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="currentColor"/>
          <path d="M18 12a6 6 0 0 1-12 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <input id="text-input" type="text" placeholder="Type a command…" aria-label="Type a command" maxlength="500">
      <button id="send-btn" class="btn primary" type="submit">Send</button>
      <button id="speak-toggle" class="btn" type="button" aria-pressed="true" title="Toggle spoken replies">Voice on</button>
    </form>
  </main>

  <dialog id="settings" class="sheet">
    <div class="sheet-head">
      <h2>Settings</h2>
      <button id="close-settings" class="icon-btn" type="button" aria-label="Close settings">&times;</button>
    </div>
    <div class="sheet-body">
      <section>
        <h3>Pairing token</h3>
        <p class="hint">Printed in the server console at startup. Stored only in this browser.</p>
        <div class="row">
          <input id="token-input" type="password" placeholder="Pairing token" aria-label="Pairing token">
          <button id="save-token" class="btn primary" type="button">Save</button>
        </div>
        <p id="conn-status" class="hint"></p>
      </section>

      <section>
        <h3>Paired devices</h3>
        <p class="hint">ARF can only act on a capability you explicitly grant. Revoke any time.</p>
        <div id="devices-list" class="devices"></div>
      </section>

      <section>
        <h3>Activity log</h3>
        <p class="hint">Hash-chained. <span id="chain-status"></span></p>
        <div id="audit-list" class="audit"></div>
      </section>
    </div>
  </dialog>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
